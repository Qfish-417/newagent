<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>newagent · AI 新闻助手</title>
<style>
:root{--ink:#172b39;--muted:#687d88;--accent:#087e81;--line:#dfE8e7}*{box-sizing:border-box}body{font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif;margin:0;color:var(--ink);background:#f3f6f4}body>h1,body>p,body>section{max-width:1100px;margin-left:auto;margin-right:auto}body>h1{padding:35px 24px 0;margin-bottom:0;font-size:32px;letter-spacing:-1px}small{font-size:15px;font-weight:400;color:var(--muted);margin-left:12px}body>p{padding:0 24px;color:var(--muted);margin-top:5px}section{background:white;padding:28px 32px;border:1px solid var(--line);border-radius:18px;margin:22px 20px;box-shadow:0 6px 25px #173b3210}h2{font-size:20px;margin:0 0 16px}label{display:block;color:var(--muted);font-size:13px}input,textarea{font:inherit;color:var(--ink);display:block;width:100%;border:1px solid var(--line);border-radius:9px;background:#fafcfb;padding:11px 13px;margin:6px 0 18px}input:focus,textarea:focus{outline:2px solid #087e8140;border-color:var(--accent)}button{font:inherit;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:10px 18px;cursor:pointer;margin:4px 8px 4px 0}button:hover{background:#eff7f5;border-color:var(--accent)}#generate,form button[type=submit],#preferences button:first-of-type,#knowledge button{background:var(--accent);color:white;border-color:var(--accent)}#preferences{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}#preferences button{align-self:end}#status,#kbstatus{color:var(--accent)}#kbdocs{margin-top:16px;color:var(--muted)}#runs{display:flex;gap:8px;flex-wrap:wrap}#runs button{font-size:13px;text-align:left}#runs button.active{border-color:var(--accent);background:#e9f5f2}#detail{font-family:inherit;font-size:16px;line-height:1.95;overflow-wrap:anywhere;max-width:790px;margin:auto;min-height:150px}#detail h1{font-size:30px;line-height:1.4}#detail h2{margin:32px 0 12px;padding-top:22px;border-top:1px solid var(--line);font-size:22px}#detail h3{font-size:19px;margin-top:25px}#detail p{margin:13px 0}#detail blockquote{margin:18px 0;padding:12px 18px;background:#eff7f4;border-left:3px solid var(--accent);font-size:14px;color:#42645f}#detail a{color:var(--accent)}details{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}summary{cursor:pointer;color:var(--muted);font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 monospace;background:#f4f7f6;padding:18px;border-radius:10px}#reading-meta{color:var(--muted);font-size:13px;margin-bottom:25px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:700px){section{padding:22px 18px;margin:16px 12px}#preferences{grid-template-columns:1fr}body>h1{font-size:27px}small{display:block;margin:0}#detail{font-size:15px}}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;width:100%}.news-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:23px;margin:0;min-height:215px;border-radius:14px;background:linear-gradient(145deg,#fff,#f6faf8);border:1px solid var(--line);transition:transform .18s,box-shadow .18s}.news-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #173b3215}.news-card .tag{font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:13px}.news-card strong{font-size:18px;line-height:1.5;color:var(--ink)}.news-card p{font-size:13px;color:var(--muted);line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.news-card .more{margin-top:auto;padding-top:15px;color:var(--accent);font-size:12px}#detail{max-width:none}.overview{padding:15px 0 24px;color:var(--muted);font-size:14px}dialog{width:min(780px,92vw);max-height:85vh;border:1px solid var(--line);border-radius:20px;padding:30px;color:var(--ink);box-shadow:0 25px 90px #102c3540}dialog::backdrop{background:#122c3960;backdrop-filter:blur(4px)}.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}.modal-top span{color:var(--accent);font-size:12px;letter-spacing:2px}#modal-body{line-height:1.95;overflow-wrap:anywhere}#modal-body h2{line-height:1.5}#modal-body a{color:var(--accent)}#modal-body blockquote{background:#f1f7f4;padding:12px;border-left:3px solid var(--accent);margin:12px 0}#modal-body p{white-space:pre-wrap}#kbdocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
</style>
<h1>newagent <small>每日 AI 新闻助手</small></h1><p>你的 AI 观察站 · 按兴趣阅读，让信息积累为知识</p>
<section><h2>订阅偏好</h2><form id="preferences">
<label>昵称<input name="nickname" required maxlength="50"></label>
<label>关注话题<input name="topics" value="AI Agent, 大模型" maxlength="1000"></label>
<label>关键词<input name="keywords" maxlength="1000"></label>
<label>排除词<input name="exclusions" maxlength="1000"></label>
<button>保存偏好</button><button type="button" id="generate">立即生成</button></form><div id="status" role="status"></div></section>
<section><h2>本地 RAG 知识库</h2><p>搜索成功后会自动保存新闻摘要及来源，重复链接不会重复入库。也可导入你自己的资料。检索采用中文双字与关键词匹配，无需额外模型或向量服务；结果仅作为背景资料。</p>
<form id="knowledge"><label>标题<input name="title" required maxlength="200"></label><label>来源（文件名或链接）<input name="source" required maxlength="500"></label><label>发布日期（可选）<input name="published_at" type="date"></label><label>正文<textarea name="content" required maxlength="50000" rows="6" style="width:95%"></textarea></label><br><button>导入知识库</button></form><div id="kbstatus" role="status"></div><div id="kbdocs"></div></section>
<section><h2>历史任务</h2><div id="runs"></div></section>
<section><h2>本期阅读</h2><div id="reading-meta">选择一份简报，开始阅读</div><article id="detail"><p class="empty">你的下一份 AI 简报，从关注的话题开始。</p></article><details><summary>查看任务与执行详情</summary><pre id="diagnostics">暂无任务记录</pre></details></section>
<dialog id="article-modal" aria-label="文章详情"><div class="modal-top"><span>NEWAGENT · 阅读详情</span><button id="close-modal" aria-label="关闭详情">关闭 ✕</button></div><div id="modal-body"></div></dialog>
<script>
const $=s=>document.querySelector(s);let selected;let lastDetail='';
async function api(path, options){const r=await fetch('/api'+path,options);const v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
async function refresh(){const rows=await api('/runs');$('#runs').replaceChildren();for(const row of rows){const b=document.createElement('button');b.textContent=new Date(row.created_at).toLocaleString()+' · '+({queued:'等待整理',running:'整理中',succeeded:'已完成',partial:'资料专题',failed:'待重试'}[row.status]||row.status);b.className=selected===row.id?'active':'';b.onclick=()=>{selected=row.id;lastDetail='';refresh()};$('#runs').append(b)}if(selected)await show()}
// Build rich text with DOM nodes; model HTML is never inserted as HTML.
function inline(parent,text){const parts=text.split(/(\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g);for(const part of parts){const link=part.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);if(link){const a=document.createElement('a');a.textContent=link[1];a.href=link[2];a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}else if(part.startsWith('**')&&part.endsWith('**')){const b=document.createElement('strong');b.textContent=part.slice(2,-2);parent.append(b)}else parent.append(document.createTextNode(part))}}
function rich(container,text){container.replaceChildren();for(const line of text.split('\n')){if(!line.trim())continue;let tag='p',value=line;const h=line.match(/^(#{1,3})\s+(.+)/);if(h){tag=h[1].length===1?'h2':'h3';value=h[2]}else if(line.startsWith('> ')){tag='blockquote';value=line.slice(2)}const node=document.createElement(tag);inline(node,value);container.append(node)}}
function openArticle(title,body){const heading=document.createElement('h2');heading.textContent=title;const content=document.createElement('div');rich(content,body);$('#modal-body').replaceChildren(heading,content);if(!$('#article-modal').open)$('#article-modal').showModal()}
$('#close-modal').onclick=()=>$('#article-modal').close();$('#article-modal').onclick=e=>{if(e.target===$('#article-modal')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.target.close()}};
function card(title,body,tag,action){const b=document.createElement('button');b.className='news-card';const badge=document.createElement('span');badge.className='tag';badge.textContent=tag;const h=document.createElement('strong');h.textContent=title.replace(/\*\*/g,'');const preview=document.createElement('p');preview.textContent=body.replace(/[#*>`]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim().slice(0,180);const more=document.createElement('span');more.className='more';more.textContent='阅读全文 ↗';b.append(badge,h,preview,more);b.onclick=action||(()=>openArticle(title,body));return b}
function render(text){$('#detail').replaceChildren();const lines=text.split('\n');let level=lines.some(l=>/^###\s+/.test(l))?3:2;const blocks=[];let current=null;const intro=[];for(const line of lines){const h=line.match(new RegExp('^#{'+level+'}\\s+(.+)'));if(h){current={title:h[1],lines:[]};blocks.push(current)}else if(current)current.lines.push(line);else intro.push(line)}const overview=document.createElement('div');overview.className='overview';// Keep the overview short; full content remains available in its own detail view.
const titleLine=intro.find(l=>/^#\s/.test(l));overview.textContent=titleLine?titleLine.replace(/^#\s+/,''):'为你整理的 AI 观察';$('#detail').append(overview);const grid=document.createElement('div');grid.className='card-grid';if(blocks.length){for(const block of blocks)grid.append(card(block.title,block.lines.join('\n'),'AI 观察 · 专题阅读'));grid.append(card('完整简报与来源',text,'本期汇总'))}else grid.append(card('阅读本期简报',text,'AI 观察'));$('#detail').append(grid)}
async function show(){const r=await api('/runs/'+selected);const fingerprint=JSON.stringify(r);if(fingerprint===lastDetail)return;lastDetail=fingerprint;const labels={queued:'等待整理',running:'正在整理',succeeded:'已完成',partial:'专题与资料补充',failed:'待重新整理'};$('#reading-meta').textContent=new Date(r.created_at).toLocaleString()+' · '+(labels[r.status]||r.status);if(r.brief)render(r.brief);else render(r.status==='failed'?'本次简报暂未完成。你可以补充相关资料，或稍后重新生成。':'正在搜集资料、梳理重点，请稍候。');$('#diagnostics').textContent=JSON.stringify({status:r.status,error:r.error,notices:r.notices,tool_calls:r.tool_calls},null,2)}
$('#preferences').onsubmit=async e=>{e.preventDefault();try{await api('/subscription',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#status').textContent='已保存'}catch(e){$('#status').textContent=e.message}};
$('#generate').onclick=async()=>{try{const r=await api('/runs',{method:'POST'});selected=r.id;$('#status').textContent='任务已创建';await refresh()}catch(e){$('#status').textContent=e.message}};
async function loadKnowledge(){const docs=await api('/knowledge');$('#kbdocs').replaceChildren();for(const d of docs){$('#kbdocs').append(card(d.title,'发布日期：'+(d.published_at||'未知')+'\n'+d.source,d.kind==='archived_news'?'搜索归档':'资料库 · 背景阅读',async()=>{try{const detail=await api('/knowledge/'+d.id);openArticle(d.title,'发布日期：'+(d.published_at||'未知')+'\n来源：'+d.source+'\n\n'+detail.content)}catch(e){$('#kbstatus').textContent='暂时无法打开资料，请稍后重试'}}))}}
$('#knowledge').onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));if(!body.published_at)body.published_at=null;await api('/knowledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#kbstatus').textContent='导入成功';e.target.reset();await loadKnowledge()}catch(e){$('#kbstatus').textContent=e.message}};
loadKnowledge().catch(e=>$('#kbstatus').textContent=e.message);
(async()=>{try{const p=await api('/subscription');if(p)for(const k of ['nickname','topics','keywords','exclusions'])$('#preferences').elements[k].value=p[k];await refresh()}catch(e){$('#status').textContent=e.message}})();setInterval(()=>refresh().catch(()=>{}),3000);
</script></html>
